name: Build iOS (IPA sin firmar)

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Version de Flutter a usar"
        required: false
        default: "3.41.9"
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.41.9' }}
          channel: stable
          cache: true

      - run: flutter doctor -v
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compilar app (sin firmar)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA sin firmar
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../StreamBox-unsigned.ipa Payload
          cd ../..
          ls -lh build/StreamBox-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: StreamBox-unsigned-ipa
          path: build/StreamBox-unsigned.ipa
          retention-days: 30
